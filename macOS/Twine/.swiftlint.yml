# Formatting belongs to swift-format (see ../.swift-format); SwiftLint covers code quality.
strict: true

excluded:
  - .build

disabled_rules:
  - trailing_comma # swift-format adds trailing commas to multiline collections

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - private_swiftui_state
  - sorted_first_last
  - unowned_variable_capture

line_length: 120

custom_rules:
  no_print:
    name: No print
    regex: '\b(print|debugPrint|dump)\('
    message: Use Logger from os instead of print.
    severity: error
