version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directories:
      - "/macOS/Twine"
      - "/macOS/TwineSyntaxPackage"
    schedule:
      interval: weekly
    groups:
      # Update each dependency's manifest requirement and app lockfile together.
      swift-dependencies:
        group-by: dependency-name
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
