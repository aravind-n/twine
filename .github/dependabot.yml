version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directories:
      - "/macOS/Twine"
      - "/macOS/TwineSyntaxPackage"
    schedule:
      interval: weekly
    ignore:
      # SwiftTreeSitter determines the compatible runtime minor version.
      - dependency-name: "github.com/tree-sitter/tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      # Update each dependency's manifest requirement and app lockfile together.
      swift-dependencies:
        group-by: dependency-name
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
