name: Set up macOS build tools and caches
description: Select Xcode 27.0, install Rust and the Metal toolchain, and restore dependency caches.

inputs:
  profile:
    description: Build profile for the Cargo cache, debug or release.
    default: debug

outputs:
  swift-cache-key:
    description: Exact dependency cache key to save after resolving packages.
    value: ${{ steps.packages.outputs.cache-primary-key }}
  swift-cache-hit:
    description: Whether the resolved dependency cache matched exactly.
    value: ${{ steps.packages.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Require Xcode 27.0
      shell: bash
      run: |
        developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
        if [[ ! -d "$developer_dir" ]]; then
          echo "::error::Xcode 27.0 is missing at $developer_dir"
          exit 1
        fi
        echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
        # sed reads all of the output. head exits early, and xcodebuild then crashes on the broken pipe.
        version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | sed -n 1p)"
        if [[ "$version" != 'Xcode 27.0' ]]; then
          echo "::error::Expected Xcode 27.0, found $version"
          exit 1
        fi
    - name: Install pinned Rust
      shell: bash
      run: |
        # rust-toolchain.toml selects the version and installs its default components.
        rustup show active-toolchain
        rustup target add aarch64-apple-darwin
        rustc --version
    - name: Install Metal toolchain if missing
      shell: bash
      run: |
        if ! xcrun metal -v >/dev/null 2>&1; then
          xcodebuild -downloadComponent MetalToolchain
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
        shared-key: macos-xcode27-macos26-arm64-${{ inputs.profile }}
        add-job-id-key: false
        # Keep large dependency caches on main, where all PRs can reuse them.
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Restore Swift packages
      id: packages
      uses: actions/cache/restore@v6
      with:
        path: out/dependencies/SourcePackages
        key: >-
          swift-packages-v2-xcode27-${{ runner.arch }}-${{
          hashFiles('macOS/**/Package.resolved', 'macOS/**/Package.swift',
          'macOS/Twine/Twine.xcodeproj/project.pbxproj') }}
        restore-keys: swift-packages-v2-xcode27-${{ runner.arch }}-
