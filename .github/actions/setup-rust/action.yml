name: Set up Rust
description: Install the repository's pinned Rust toolchain and requested targets.

inputs:
  targets:
    description: Space-separated additional compilation targets.
    default: ''
  components:
    description: Space-separated additional toolchain components.
    default: ''

runs:
  using: composite
  steps:
    - name: Install pinned Rust
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.targets }}
        RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        # rust-toolchain.toml selects the version and installs its default components.
        rustup show active-toolchain
        read -ra targets <<< "$RUST_TARGETS"
        read -ra components <<< "$RUST_COMPONENTS"
        if (( ${#targets[@]} )); then rustup target add "${targets[@]}"; fi
        if (( ${#components[@]} )); then rustup component add "${components[@]}"; fi
        rustc --version
