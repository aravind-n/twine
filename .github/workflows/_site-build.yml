name: Site Build

on:
  workflow_call:
    inputs:
      swift_docs_key:
        description: Exact cache key for validated Swift documentation.
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore matching Rust documentation
        id: rust-docs
        uses: actions/cache@v6
        with:
          path: target/api-docs-rust/doc
          key: >-
            rust-docs-v1-linux-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', 'Makefile', '.github/workflows/_site-build.yml') }}
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        if: steps.rust-docs.outputs.cache-hit != 'true'
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        if: steps.rust-docs.outputs.cache-hit != 'true'
        with:
          workspaces: . -> target/api-docs-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Rust API docs
        if: steps.rust-docs.outputs.cache-hit != 'true'
        run: make docs-rust
      - name: Restore matching Swift documentation
        uses: actions/cache/restore@v6
        with:
          path: target/api-docs-swift/Build/Products/Debug/Twine.doccarchive
          key: ${{ inputs.swift_docs_key }}
          fail-on-cache-miss: true
      - name: Assemble website
        run: make assemble-site
      - name: Assemble update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: make update-feed OUTPUT_DIR=dist/twine
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/twine
