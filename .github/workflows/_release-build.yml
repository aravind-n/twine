name: Release Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the caller's commit.
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-build:
    name: Build release artifacts
    runs-on: xcode-27
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      TWINE_UPDATE_PUBLIC_KEY: ${{ vars.TWINE_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up macOS build tools and caches
        uses: ./.github/actions/setup-build
        id: build-tools
        with:
          profile: release
      - name: 'Build Rust framework: universal Release'
        if: steps.build-tools.outputs.bridge-cache-hit != 'true'
        run: make framework-release
      - name: Resolve Swift packages
        run: make resolve-swift-packages
      - name: Build universal Release app
        id: build-app
        run: >-
          make release-build-app DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          XCODE_BUILD_ARGS="CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$BUILD_NUMBER TWINE_UPDATE_PUBLIC_KEY=$TWINE_UPDATE_PUBLIC_KEY"
      - name: Bundle release artifacts
        run: >-
          make release-bundle DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          BUNDLE_DIR="$RUNNER_TEMP/bundle"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Twine-${{ inputs.version }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Save resolved Swift dependencies on main
        if: >-
          always() && !cancelled() && github.ref == 'refs/heads/main' &&
          steps.build-app.outcome == 'success' &&
          steps.build-tools.outputs.swift-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: macOS/Twine/.build/SourcePackages
          key: ${{ steps.build-tools.outputs.swift-cache-key }}
