name: Release Build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the caller's commit.
        type: string
        required: false
        default: ''
      version:
        type: string
        required: true
      build_number:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-build:
    runs-on: xcode-27
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Restore Release bridge
        id: bridge-cache
        uses: actions/cache@v6
        with:
          path: macOS/TwineCorePackage/TwineCore.xcframework
          key: >-
            twine-bridge-v1-release-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'macOS/TwineCorePackage/build.sh') }}
      - uses: ./.github/actions/setup-macos
        with:
          metal: 'true'
          rust: ${{ steps.bridge-cache.outputs.cache-hit != 'true' && 'true' || 'false' }}
          rust-targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Rebuild Release bridge when uncached
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: make framework-release
      - name: Build universal Release app
        run: >-
          make release-build-app DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          XCODE_BUILD_ARGS="CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
      - name: Package reusable app, library, header, and symbols
        run: >-
          make release-bundle DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          BUNDLE_DIR="$RUNNER_TEMP/bundle"
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Twine-${{ inputs.version }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
