name: Release Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-build:
    runs-on: xcode-27
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore Release bridge
        uses: actions/cache/restore@v6
        with:
          path: macOS/TwineCorePackage/TwineCore.xcframework
          key: >-
            twine-bridge-v1-release-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'macOS/TwineCorePackage/build.sh') }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/setup-macos
        with:
          metal: 'true'
      - name: Build universal Release app
        run: >-
          xcodebuild build -project macOS/Twine/Twine.xcodeproj -scheme Twine
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Stamp version and package app
        run: |
          if [[ ! "$BUILD_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid artifact version: $BUILD_VERSION"
            exit 1
          fi
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Twine.app"
          test -d "$app"
          archs="$(xcrun lipo -archs "$app/Contents/MacOS/Twine")"
          if [[ " $archs " != *' arm64 '* || " $archs " != *' x86_64 '* ]]; then
            echo "::error::Expected a universal app, found architectures: $archs"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Add :TwineBuildVersion string $BUILD_VERSION" "$app/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Twine-$BUILD_VERSION.zip"
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: Twine-${{ inputs.version }}
          path: ${{ runner.temp }}/Twine-${{ inputs.version }}.zip
          if-no-files-found: error
