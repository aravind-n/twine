name: Notify Homebrew tap

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: notify-tap-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate the tap notification
        id: tap-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: TwineProject
          repositories: homebrew-tap
          permission-contents: write
      - name: Trigger the cask updater
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: >-
          gh api --method POST repos/TwineProject/homebrew-tap/dispatches
          -f event_type=twine-release-published
