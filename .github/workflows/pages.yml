name: GitHub Pages

# Building the site happens inside CI, sharing its macOS allocation.
# Deployment remains separate so a Pages failure cannot block app releases.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Find website artifact for the current main commit
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          available="$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
          if [[ "$BUILD_SHA" == "$main_sha" && "$available" == 1 ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download website artifact
        if: steps.site.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: site-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Attach website to this deployment run
        if: steps.site.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: site-artifact/artifact.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Configure Pages
        if: steps.site.outputs.available == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy website
        if: steps.site.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
