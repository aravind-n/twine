name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'twine-core/**'
      - 'twine-bridge/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'macOS/**'
      - '.github/actions/setup-macos/**'
      - 'Makefile'
      - '.github/workflows/pages.yml'
      - '.github/site/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'twine-core/**'
      - 'twine-bridge/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'macOS/**'
      - '.github/actions/setup-macos/**'
      - 'Makefile'
      - '.github/workflows/pages.yml'
      - '.github/site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-downloads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test macOS download flow
        run: make check-site PLAYWRIGHT_INSTALL_ARGS=--with-deps
      - name: Upload failed browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-test-results
          path: .github/site/test-results/
          retention-days: 7

  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-macos
        with:
          rust: 'true'
          rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          metal: 'true'
      - name: Build website and API documentation
        run: make build-site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/twine

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, test-downloads]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
