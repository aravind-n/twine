name: Test Rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Require Xcode 27.0
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 27.0 is missing at $DEVELOPER_DIR"
            exit 1
          fi
          version="$(xcodebuild -version | head -n 1)"
          if [[ "$version" != 'Xcode 27.0' ]]; then
            echo "::error::Expected Xcode 27.0, found $version"
            exit 1
          fi
      - name: Install latest stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit
