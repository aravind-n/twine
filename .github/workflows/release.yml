name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
      sha: ${{ steps.guard.outputs.sha }}
      build_run: ${{ steps.guard.outputs.build_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and changelog, find main CI build
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash .github/release/bundle-artifact.sh guard "$GITHUB_REF_NAME" "out/packaging/notes/notes.md"
          sha="$(git rev-parse HEAD)"
          run_id="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs" --method GET \
            -f branch=main -f event=push -f head_sha="$sha" -f status=success -f per_page=100 \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo '::error::Wait for a successful push-to-main CI run on this commit before releasing'
            exit 1
          fi
          available="$(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" \
            | jq --arg name "Twine-ci-$sha" '[.artifacts[] | select(.name == $name and .expired == false)] | length')"
          if [[ "$available" == 0 ]]; then
            echo '::error::The CI build for this commit has expired; re-run CI on main for this commit, then re-run this job'
            exit 1
          fi
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "sha=$sha"
            echo "build_run=$run_id"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: out/packaging/notes/notes.md
          if-no-files-found: error
          overwrite: true

  package:
    needs: guard
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Download main CI build
        uses: actions/download-artifact@v8
        with:
          name: Twine-ci-${{ needs.guard.outputs.sha }}
          path: out/packaging/bundle
          run-id: ${{ needs.guard.outputs.build_run }}
          github-token: ${{ github.token }}
      - name: Install DMG tools
        run: make dmg-tools
      - name: Create signed release artifacts
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: >-
          bash .github/release/with-signing.sh
          bash .github/release/bundle-artifact.sh package "$VERSION"
          "$GITHUB_WORKSPACE/out/packaging/bundle"
          "$GITHUB_WORKSPACE/out/packaging/release"
      - name: Validate signed release DMG
        env:
          TWINE_SIGNING_MODE: developer-id
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: make validate-dmg DMG="$GITHUB_WORKSPACE/out/packaging/release/Twine-$VERSION-macos-arm64.dmg" VERSION="$VERSION"
      - name: Upload notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-notarization
          path: out/packaging/notarization/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: out/packaging/release/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [guard, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: out/packaging/assets
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: out/packaging/notes
      - name: Create or update a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          (cd out/packaging/assets && sha256sum -c SHA256SUMS)
          # Retries may replace assets only on this commit's draft, never a published release.
          if gh release view "$GITHUB_REF_NAME" --json isDraft,targetCommitish > out/packaging/release.json; then
            jq -e --arg sha "$RELEASE_SHA" '.isDraft and .targetCommitish == $sha' out/packaging/release.json >/dev/null
            gh release edit "$GITHUB_REF_NAME" --draft --notes-file out/packaging/notes/notes.md
            gh release upload "$GITHUB_REF_NAME" out/packaging/assets/* --clobber
          else
            # Do not leave a newly created partial draft after an upload failure.
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --target "$RELEASE_SHA" \
              --title "$GITHUB_REF_NAME" --notes-file out/packaging/notes/notes.md
            trap 'gh release delete "$GITHUB_REF_NAME" --yes' ERR
            gh release upload "$GITHUB_REF_NAME" out/packaging/assets/*
            trap - ERR
          fi
