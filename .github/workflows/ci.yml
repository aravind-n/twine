name: CI

# After a merge: build the release candidate. Pull requests run every test in pr.yml.
# release.yml signs the Build release artifact from this workflow's successful run on the tagged
# commit, and the app's build number is this workflow's run number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build-release:
    name: Build release
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up macOS build tools and caches
        uses: ./.github/actions/setup-build
        with:
          profile: release
      - name: Build and validate release app
        uses: ./.github/actions/build-release
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Twine-ci-${{ github.sha }}
          path: out/packaging/bundle/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
