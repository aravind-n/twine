name: CI

# Pull requests run every check their changes select, and ci-gate is the one required check.
# Main only accepts up-to-date pull requests, so pushes to main skip those checks and run
# only the work pull requests don't: UI tests and the release build.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      libraries: ${{ steps.filter.outputs.libraries }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      app: ${{ steps.filter.outputs.app }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Workflow changes select every check, because main doesn't re-run them after merging.
          filters: |
            libraries:
              - 'twine-core/**'
              - 'twine-bridge/**'
              - 'TwineBridgePackage/Package.swift'
              - 'scripts/build-bridge.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'
            lockfile:
              - 'Cargo.lock'
              - '.github/**'
            app:
              - 'macOS/**/!(*.md)'
              - 'twine-core/**'
              - 'twine-bridge/**'
              - 'TwineBridgePackage/Package.swift'
              - 'scripts/build-bridge.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/**'
            workflows:
              - '.github/**'

  library-checks:
    needs: changes
    if: needs.changes.outputs.libraries == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-macos
        with:
          rust: 'true'
          rust-components: rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked

  library-build:
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' ||
      (needs.changes.result == 'success' && needs.changes.outputs.app == 'true'))
    runs-on: xcode-27
    strategy:
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v7
      - name: Restore prebuilt bridge
        id: bridge-cache
        uses: actions/cache@v6
        with:
          path: TwineBridgePackage/TwineBridge.xcframework
          key: >-
            twine-bridge-v1-${{ matrix.profile }}-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'scripts/build-bridge.sh') }}
      - uses: ./.github/actions/setup-macos
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        with:
          rust: 'true'
          rust-targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Build bridge framework
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: scripts/build-bridge.sh "${{ matrix.profile }}"

  dependency-audit:
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    uses: ./.github/workflows/_dependency-audit.yml

  app-checks:
    needs: [changes, library-build]
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Restore Debug bridge
        uses: actions/cache/restore@v6
        with:
          path: TwineBridgePackage/TwineBridge.xcframework
          key: >-
            twine-bridge-v1-debug-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'scripts/build-bridge.sh') }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/setup-macos
        with:
          metal: 'true'
      - name: Check Swift formatting
        run: swift format lint --strict --recursive macOS/
      - name: Run SwiftLint
        run: macOS/Twine/Scripts/swiftlint.sh
      - name: Build app for testing (Debug)
        run: >-
          xcodebuild build-for-testing -project macOS/Twine/Twine.xcodeproj -scheme Twine
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: >-
          xcodebuild test-without-building -project macOS/Twine/Twine.xcodeproj -scheme Twine
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:TwineTests

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 \
            -color -ignore 'label "xcode-27" is unknown'

  ci-gate:
    needs: [changes, library-checks, library-build, dependency-audit, app-checks, actionlint]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LIBRARIES_SELECTED: ${{ needs.changes.outputs.libraries }}
      LOCKFILE_SELECTED: ${{ needs.changes.outputs.lockfile }}
      APP_SELECTED: ${{ needs.changes.outputs.app }}
      WORKFLOWS_SELECTED: ${{ needs.changes.outputs.workflows }}
      LIBRARY_CHECKS_RESULT: ${{ needs.library-checks.result }}
      LIBRARY_BUILD_RESULT: ${{ needs.library-build.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      APP_CHECKS_RESULT: ${{ needs.app-checks.result }}
      ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
    steps:
      - name: Require selected jobs to pass
        run: |
          failed=0
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "::error::changes was $CHANGES_RESULT (expected success)"
            failed=1
          fi
          check_job() {
            local name="$1" selected="$2" result="$3" expected=skipped
            if [[ "$selected" == true ]]; then expected=success; fi
            if [[ "$result" != "$expected" ]]; then
              echo "::error::$name was $result (expected $expected)"
              failed=1
            else
              echo "$name: $result"
            fi
          }
          check_job library-checks "$LIBRARIES_SELECTED" "$LIBRARY_CHECKS_RESULT"
          check_job library-build "$APP_SELECTED" "$LIBRARY_BUILD_RESULT"
          check_job dependency-audit "$LOCKFILE_SELECTED" "$DEPENDENCY_AUDIT_RESULT"
          check_job app-checks "$APP_SELECTED" "$APP_CHECKS_RESULT"
          check_job actionlint "$WORKFLOWS_SELECTED" "$ACTIONLINT_RESULT"
          exit "$failed"

  ui-tests:
    needs: library-build
    if: github.event_name == 'push'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Restore Debug bridge
        uses: actions/cache/restore@v6
        with:
          path: TwineBridgePackage/TwineBridge.xcframework
          key: >-
            twine-bridge-v1-debug-${{
            hashFiles('twine-core/**', 'twine-bridge/**', 'Cargo.toml', 'Cargo.lock',
            'scripts/build-bridge.sh') }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/setup-macos
        with:
          metal: 'true'
      - name: Build app for testing (Debug)
        run: >-
          xcodebuild build-for-testing -project macOS/Twine/Twine.xcodeproj -scheme Twine
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Run UI tests
        run: >-
          xcodebuild test-without-building -project macOS/Twine/Twine.xcodeproj -scheme Twine
          -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -only-testing:TwineUITests

  release-build:
    needs: library-build
    if: github.event_name == 'push'
    uses: ./.github/workflows/_release-build.yml
    with:
      version: ci-${{ github.sha }}
