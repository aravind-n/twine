name: CI

# Required PR checks is the required check. Native validation uses one Mac per PR;
# main starts UI tests and the universal Release build independently.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      libraries: ${{ steps.filter.outputs.libraries }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      app: ${{ steps.filter.outputs.app }}
      workflows: ${{ steps.filter.outputs.workflows }}
      # Every main run assembles a deployable site from cached docs, so a newer
      # unrelated commit cannot strand an older run's pending site update.
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      swift_docs_key: ${{ steps.swift-docs.outputs.cache-primary-key }}
      swift_docs_cached: ${{ steps.swift-docs.outputs.cache-hit == 'true' }}
      native: >-
        ${{ github.event_name != 'pull_request' ||
        steps.filter.outputs.libraries == 'true' || steps.filter.outputs.app == 'true' ||
        (steps.filter.outputs.site == 'true' && steps.swift-docs.outputs.cache-hit != 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            libraries:
              - 'twine-core/**'
              - 'twine-bridge/**'
              - 'macOS/TwineCorePackage/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/actions/**'
              - '.github/ci/**'
              - '.github/workflows/**'
              - 'Makefile'
            lockfile:
              - 'Cargo.lock'
              - '.github/workflows/_cargo-audit.yml'
            app:
              - 'macOS/**/!(*.md)'
              - 'twine-core/**'
              - 'twine-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/actions/**'
              - '.github/ci/**'
              - '.github/workflows/**'
              - '.github/release/**'
              - 'Makefile'
            workflows:
              - '.github/**'
              - 'rust-toolchain.toml'
              - 'Makefile'
            site:
              - 'docs/**'
              - 'twine-core/**'
              - 'twine-bridge/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'macOS/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/pages.yml'
              - '.github/workflows/_site-build.yml'
              - '.github/release/appcast.py'
              - 'Makefile'
      - name: Look up matching Swift documentation
        if: github.event_name != 'pull_request' || steps.filter.outputs.site == 'true'
        id: swift-docs
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: target/api-docs-swift/Build/Products/Debug/Twine.doccarchive
          key: >-
            swift-docs-v1-xcode27-${{
            hashFiles('macOS/Twine/Twine/**/*.swift', 'macOS/Twine/Twine/Documentation.docc/**',
            'macOS/TwineSyntaxPackage/**', 'macOS/TwineCorePackage/Package.swift',
            'macOS/**/Package.resolved', 'macOS/Twine/Twine.xcodeproj/**',
            'twine-bridge/include/**', 'rust-toolchain.toml',
            '.github/actions/**', 'Makefile') }}

  rust-lint:
    name: Rust linting
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting and Clippy
        run: make lint-rust

  native-checks:
    name: macOS build and tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    env:
      XCODE_BUILD_ARGS: COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up macOS build tools and caches
        uses: ./.github/actions/setup-build
        id: build-tools
      - name: 'Build Rust framework: ARM64 Debug'
        if: steps.build-tools.outputs.bridge-cache-hit != 'true'
        run: make framework FRAMEWORK_ARCHS=arm64
      - name: Install shell test dependencies
        if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
        run: command -v fish >/dev/null || brew install fish
      - name: Check Rust formatting and Clippy
        if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
        run: make lint-rust
      - name: Run Rust tests on macOS
        if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
        env:
          TWINE_REQUIRE_FISH_TESTS: '1'
        run: make test-rust
      - name: Install agent test dependencies
        if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
        run: command -v node >/dev/null || brew install node
      - name: Test agent extensions
        if: github.event_name == 'pull_request' && needs.changes.outputs.libraries == 'true'
        run: |
          TWINE_NODE="$(command -v node)"
          export TWINE_NODE
          make test-rust RUST_TEST_ARGS='harness::pi::tests::omp_extension -- --include-ignored'
          make test-rust RUST_TEST_ARGS='harness::pi::tests::pi_extension_preserves -- --include-ignored'
      - name: Resolve Swift packages
        run: make resolve-swift-packages
      - name: Check Swift formatting and lint
        if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
        run: make lint-macos-built
      - name: Install release packaging tools
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true'
        run: make dmg-tools sparkle-tools
      - name: Test release packaging scripts
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true'
        run: make check-release-package
      - name: Build Debug app for testing
        id: build-app
        if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
        run: make build-macos-for-testing
      - name: Run unit tests
        if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
        id: unit-tests
        run: make test-macos-built
      - name: Build Swift API docs
        if: needs.changes.outputs.site == 'true' && needs.changes.outputs.swift_docs_cached != 'true'
        run: make docs-swift-built SWIFT_DOC_DERIVED_DATA="$TEST_DERIVED_DATA"
      - name: Save matching Swift documentation
        if: needs.changes.outputs.site == 'true' && needs.changes.outputs.swift_docs_cached != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/api-docs-swift/Build/Products/Debug/Twine.doccarchive
          key: ${{ needs.changes.outputs.swift_docs_key }}
      - name: Run UI tests
        if: github.event_name != 'pull_request'
        id: ui-tests
        run: make ui-test-macos-built
      - name: Run updater UI tests
        if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
        id: updater-tests
        run: make test-updater-macos-built
      - name: Upload failed test results
        if: >-
          failure() && (steps.unit-tests.outcome == 'failure' ||
          steps.ui-tests.outcome == 'failure' || steps.updater-tests.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/DerivedData/Logs/Test/*.xcresult
          retention-days: 7
      - name: Save resolved Swift dependencies on main
        if: >-
          always() && !cancelled() && github.ref == 'refs/heads/main' &&
          steps.build-app.outcome == 'success' &&
          steps.build-tools.outputs.swift-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: macOS/Twine/.build/SourcePackages
          key: ${{ steps.build-tools.outputs.swift-cache-key }}
      - name: Report cache reuse
        if: always()
        env:
          BRIDGE_HIT: ${{ steps.build-tools.outputs.bridge-cache-hit }}
          PACKAGES_HIT: ${{ steps.build-tools.outputs.swift-cache-hit }}
          DOCS_HIT: ${{ needs.changes.outputs.swift_docs_cached }}
        run: |
          {
            echo "| Cache | Exact match |"
            echo "| --- | --- |"
            echo "| Debug framework | $BRIDGE_HIT |"
            echo "| Swift dependencies | $PACKAGES_HIT |"
            echo "| Swift documentation | $DOCS_HIT |"
          } >> "$GITHUB_STEP_SUMMARY"

  cargo-audit:
    name: Rust dependency security
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.lockfile == 'true'
    uses: ./.github/workflows/_cargo-audit.yml

  actionlint:
    name: Workflow and script checks
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows and shell scripts
        run: >-
          make lint-ci lint-release-scripts
          ACTIONLINT="docker run --rm -v \"$PWD:/repo\" --workdir /repo rhysd/actionlint:1.7.12 -color"
      - name: Test CI and release scripts
        run: make test-ci test-release-scripts

  # A warm documentation cache lets website-only changes run entirely on Linux.
  # The two paths avoid waiting for native validation when docs are already available.
  site-cached:
    name: 'Build website: cached Swift docs'
    needs: changes
    if: needs.changes.outputs.site == 'true' && needs.changes.outputs.swift_docs_cached == 'true'
    uses: ./.github/workflows/_site-build.yml
    with:
      swift_docs_key: ${{ needs.changes.outputs.swift_docs_key }}

  site-generated:
    name: 'Build website: fresh Swift docs'
    needs: [changes, native-checks]
    if: >-
      needs.changes.outputs.site == 'true' &&
      needs.changes.outputs.swift_docs_cached != 'true'
    uses: ./.github/workflows/_site-build.yml
    with:
      swift_docs_key: ${{ needs.changes.outputs.swift_docs_key }}

  ci-gate:
    name: Required PR checks
    needs: [changes, rust-lint, native-checks, cargo-audit, actionlint, site-cached, site-generated]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LIBRARIES_SELECTED: ${{ needs.changes.outputs.libraries }}
      LOCKFILE_SELECTED: ${{ needs.changes.outputs.lockfile }}
      NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
      WORKFLOWS_SELECTED: ${{ needs.changes.outputs.workflows }}
      SITE_SELECTED: ${{ needs.changes.outputs.site }}
      SWIFT_DOCS_CACHED: ${{ needs.changes.outputs.swift_docs_cached }}
      RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
      NATIVE_CHECKS_RESULT: ${{ needs.native-checks.result }}
      CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
      ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
      SITE_CACHED_RESULT: ${{ needs.site-cached.result }}
      SITE_GENERATED_RESULT: ${{ needs.site-generated.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Required PR checks
        run: bash .github/ci/gate.sh

  release-build:
    name: Build release artifacts
    if: github.event_name == 'push'
    uses: ./.github/workflows/_release-build.yml
    with:
      version: ci-${{ github.sha }}
      build_number: ${{ github.run_number }}
