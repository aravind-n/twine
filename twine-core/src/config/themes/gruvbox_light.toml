# Medium contrast. Selection uses the palette's bg2 color.
[terminal.colors]
background = "#fbf1c7"
foreground = "#3c3836"
cursor = "#3c3836"
selection = "#d5c4a1"

black = "#fbf1c7"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#7c6f64"
brblack = "#928374"
brred = "#9d0006"
brgreen = "#79740e"
bryellow = "#b57614"
brblue = "#076678"
brmagenta = "#8f3f71"
brcyan = "#427b58"
brwhite = "#3c3836"
