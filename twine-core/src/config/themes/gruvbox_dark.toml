# Medium contrast. Selection uses the palette's bg2 color.
[terminal.colors]
background = "#282828"
foreground = "#ebdbb2"
cursor = "#ebdbb2"
selection = "#504945"

black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
brblack = "#928374"
brred = "#fb4934"
brgreen = "#b8bb26"
bryellow = "#fabd2f"
brblue = "#83a598"
brmagenta = "#d3869b"
brcyan = "#8ec07c"
brwhite = "#ebdbb2"
